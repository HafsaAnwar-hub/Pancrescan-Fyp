<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script>(function(){if(localStorage.getItem('ps_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — PancreaScan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <div class="container nav">
      <a href="index.html" class="brand">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4" />
          </svg>
        </span>
        PancreaScan
      </a>
      <ul class="nav-links">
        <li><a href="how-it-works.html">How it works</a></li>
        <li><a href="features.html">Features</a></li>
        <li><a href="reviews.html">Reviews</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:flex"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
        <a href="login.html" class="link-btn">Back to log in</a>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="modal modal-wrap">
      <h2>Reset your password</h2>
      <p class="sub">Enter your account email to receive a reset code by email, then choose a new password.</p>
      <p class="form-message" id="form-message"></p>

      <form id="request-code-form">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" required>
        </div>
        <button type="submit" class="btn btn-dark">Send reset code</button>
      </form>


      <form id="reset-password-form" hidden>
        <div class="field">
          <label for="reset-email">Email address</label>
          <input type="email" id="reset-email" required readonly>
        </div>
        <div class="field">
          <label for="reset-code">Reset code</label>
          <input type="text" id="reset-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="6-digit code">
        </div>
        <div class="field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" required minlength="6">
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-dark">Update password</button>
      </form>

      <p class="auth-link-row">
        <a href="login.html">← Back to log in</a>
      </p>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
