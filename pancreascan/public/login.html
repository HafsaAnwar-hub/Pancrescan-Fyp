<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script>(function(){if(localStorage.getItem('ps_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — PancreaScan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <div class="container nav">
      <a href="index.html" class="brand">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4" />
          </svg>
        </span>
        PancreaScan
      </a>
      <ul class="nav-links">
        <li><a href="how-it-works.html">How it works</a></li>
        <li><a href="features.html">Features</a></li>
        <li><a href="reviews.html">Reviews</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:flex"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
        <a href="signup.html" class="link-btn">Create account</a>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="modal modal-wrap">
      <div class="modal-tabs">
        <a href="login.html" class="modal-tab active">Log in</a>
        <a href="signup.html" class="modal-tab">Create account</a>
      </div>
      <h2>Welcome back</h2>
      <p class="sub">Log in to view your reports and upload new scans.</p>
      <p class="form-message" id="form-message"></p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" required style="padding-right: 42px; width: 100%;">
            <button type="button" onclick="togglePasswordVisibility('password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text); opacity: 0.7; display: flex; align-items: center;" title="Toggle password visibility">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <p class="auth-link-row">
          <a href="forgot-password.html">Forgot password?</a>
        </p>
        <button type="submit" class="btn btn-dark">Log in</button>
      </form>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
